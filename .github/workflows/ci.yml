# One job per verification stage (docs/PROCESS.md). Branch protection requires every job.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: node scripts/check.mjs build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: node scripts/check.mjs lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: node scripts/check.mjs unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: node scripts/check.mjs integration

  functional:
    needs: [build, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: uv run --frozen playwright install --with-deps chromium
      - run: node scripts/check.mjs functional
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
      # Every run, so reviewers can see the UI the code produces, even when a test failed
      # (docs/specs/ci-screenshot-artifacts.md).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-screenshots
          path: test-results/screenshots/
          retention-days: 14
          if-no-files-found: error
      - if: always()
        run: node scripts/screenshot-summary.mjs test-results/screenshots >> "$GITHUB_STEP_SUMMARY"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: node scripts/check.mjs security

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: node scripts/check.mjs architecture
